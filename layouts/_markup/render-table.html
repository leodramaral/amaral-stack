<div class="overflow-x-auto my-6 border border-line rounded-lg">
  <table class="w-full border-collapse text-ink text-[0.9rem] min-w-full"
    {{- range $k, $v := .Attributes }}
      {{- if $v }}
        {{- printf " %s=%q" $k $v | safeHTMLAttr }}
      {{- end }}
    {{- end }}>
    <thead class="bg-shell border-b border-line">
      {{- range .THead }}
        <tr>
          {{- range . }}
            <th class="px-4 py-3 font-medium text-left text-ink whitespace-nowrap"
              {{- with .Alignment }}
                {{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}
              {{- end -}}
            >
              {{- .Text -}}
            </th>
          {{- end }}
        </tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
        <tr class="border-b border-line transition-colors hover:bg-shell last:border-b-0">
          {{- range . }}
            <td class="px-4 py-3 text-muted"
              {{- with .Alignment }}
                {{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}
              {{- end -}}
            >
              {{- .Text -}}
            </td>
          {{- end }}
        </tr>
      {{- end }}
    </tbody>
  </table>
</div>
