{{- $level := .Level -}}
{{- $id := .Anchor | safeURL -}}
{{- $size := index (slice "" "text-2xl sm:text-3xl" "text-xl sm:text-2xl" "text-lg sm:text-xl" "text-base sm:text-lg") (math.Min $level 4 | int) -}}
<h{{ $level }} id="{{ $id }}" class="group mt-10 mb-3 scroll-mt-8 font-display font-medium tracking-tight text-ink {{ $size }}">
  {{ .Text }}
  <a href="#{{ $id }}" aria-hidden="true" tabindex="-1"
    class="ml-2 text-muted opacity-0 transition-opacity !no-underline group-hover:opacity-100">#</a>
</h{{ $level }}>
