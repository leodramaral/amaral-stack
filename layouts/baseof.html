<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">

<head>
  {{ partial "head.html" . }}
</head>

<body class="bg-canvas font-sans text-ink antialiased">
  <a href="#main"
    class="sr-only rounded-sm bg-accent-deep px-3 py-2 text-sm font-medium text-white focus:not-sr-only focus:absolute focus:top-3 focus:left-3 focus:z-50">{{ T "skip_to_content" }}</a>

  {{ partial "header.html" . }}

  <div class="lg:pl-72">
    <div class="isolate flex min-h-dvh flex-col bg-panel lg:m-2 lg:min-h-[calc(100dvh-1rem)] lg:rounded-xl lg:border lg:border-line">
      <main id="main" class="flex-1">
        <div id="swup" class="swup-transition-fade">
          <div class="mx-auto w-full max-w-3xl px-6 py-10 sm:px-10 lg:py-16">
            {{ block "main" . }}{{ end }}
          </div>
        </div>
      </main>

      {{ partial "footer.html" . }}
    </div>
  </div>
</body>

</html>
