{{- /* Title, date, reading time, tags */ -}}
<header class="mb-8">
  <h1 class="display-hero font-display font-medium text-balance">{{ .Title }}</h1>
  <p class="meta-mono mt-4 flex flex-wrap items-center gap-x-2 gap-y-1 text-muted">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ partial "date.html" (dict "date" .Date "long" true) }}</time>
    <span aria-hidden="true" class="text-line">/</span>
    <span>{{ .ReadingTime }} {{ T "min_read" }}</span>
  </p>
  {{- with .GetTerms "tags" }}
  <p class="meta-mono mt-3 flex flex-wrap gap-x-3 gap-y-1 text-muted/80">
    {{- range . }}
    <a href="{{ .RelPermalink }}" class="hover:text-accent">#{{ .LinkTitle }}</a>
    {{- end }}
  </p>
  {{- end }}
</header>
