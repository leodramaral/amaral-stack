{{- $url := .Permalink }}
{{- $title := .Title }}
{{- $encodedURL := printf "%s" (urls.Parse $url).String }}
{{- $encodedTitle := urlquery $title }}
<div class="mt-12 border-t border-line pt-6">
  <p class="section-label mb-4 text-muted">{{ T "share" }}</p>
  <div class="flex flex-wrap items-center gap-2">
    <a href="https://x.com/intent/tweet?url={{ $encodedURL }}&text={{ $encodedTitle }}" target="_blank" rel="noopener"
      class="press meta-mono inline-flex items-center gap-2 rounded-full border border-line px-3.5 py-2 text-muted hover:border-accent hover:text-accent">
      <i class="devicon-twitter-original"></i> X
    </a>
    <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ $encodedURL }}" target="_blank" rel="noopener"
      class="press meta-mono inline-flex items-center gap-2 rounded-full border border-line px-3.5 py-2 text-muted hover:border-accent hover:text-accent">
      <i class="devicon-linkedin-plain"></i> LinkedIn
    </a>
    <button onclick="navigator.clipboard.writeText(window.location.href);this.dataset.copied='true';this.querySelector('span').textContent={{ T "copied" | jsonify }};setTimeout(()=>{this.dataset.copied='';this.querySelector('span').textContent={{ T "copy_link" | jsonify }}},2000)"
      class="press meta-mono inline-flex items-center gap-2 rounded-full border border-line px-3.5 py-2 text-muted hover:border-accent hover:text-accent cursor-pointer">
      <i class="fa-solid fa-link"></i> <span>{{ T "copy_link" }}</span>
    </button>
  </div>
</div>
