{{ define "main" }}

<section class="flex flex-col items-center justify-center text-center py-12 md:py-20">

  <img src="{{ "perfil.jpg" | relURL }}" alt="Leandro Amaral"
    class="w-36 h-36 sm:w-44 sm:h-44 md:w-52 md:h-52 rounded-full border-4 border-blue-200/30 object-cover shadow-lg shadow-blue-200/10 mb-8" />

  <h1 class="text-3xl sm:text-4xl md:text-5xl font-semibold text-white tracking-wide mb-3">
    Leandro Amaral
  </h1>

  <div class="max-w-xl space-y-4 text-gray-300 sm:text-lg md:text-xl leading-relaxed [&_a]:text-blue-200
            [&_a]:underline
            [&_a:hover]:text-blue-100
            [&_a]:transition-colors
            [&_a]:duration-200">
    {{ with site.GetPage "page" "about" }}
    {{ .Content }}
    {{ end }}
  </div>

</section>

{{ end }}
