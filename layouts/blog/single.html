{{ define "main" }}
<article class="min-w-0">
  {{ partial "article/meta.html" . }}

  {{- if .TableOfContents }}
  <details class="mb-8 max-w-[44rem] rounded-lg border border-line">
    <summary class="section-label cursor-pointer select-none px-4 py-3 text-muted hover:text-ink">{{ T "table_of_contents" }}</summary>
    <nav class="toc px-4 pb-4" aria-label="{{ T "table_of_contents" }}">{{ .TableOfContents }}</nav>
  </details>
  {{- end }}

  <div class="md-content max-w-[44rem] text-[0.9375rem] leading-relaxed sm:text-base">
    {{ .Content }}
  </div>

  {{ partial "article/share.html" . }}
  {{ partial "article/related.html" . }}
</article>
{{ end }}
