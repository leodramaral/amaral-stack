{{ define "main" }}
<header class="mb-8">
  <h1 class="display-hero font-display font-medium">{{ .Title }}</h1>
  <p class="meta-mono mt-3 text-muted">{{ len .RegularPages }} {{ T "items_under" }}</p>
</header>

<div class="flex flex-col">
  {{- range .RegularPages.ByDate.Reverse }}
  {{ partial "post-row.html" . }}
  {{- else }}
  <p class="py-10 text-muted">{{ T "no_entries" }}</p>
  {{- end }}
</div>
{{ end }}
