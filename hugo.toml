baseURL = 'https://example.org/'
defaultContentLanguage = 'pt'
theme = 'enervoid'

[languages]
  [languages.pt]
    languageCode = 'pt-br'
    languageName = 'BR'
    title = 'Amaral Stack'
    weight = 1

    [languages.pt.menus]
      [[languages.pt.menus.main]]
        name = 'Blog'
        pageRef = '/blog'
        weight = 10

    [languages.pt.params]
      avatar = "/perfil.jpg"

      [[languages.pt.params.socials]]
        link = "https://github.com/leandroamaral"
        icon = "devicon-github-original"
      [[languages.pt.params.socials]]
        link = "https://linkedin.com/in/leandroamaral"
        icon = "devicon-linkedin-plain"
      [[languages.pt.params.socials]]
        link = "https://x.com/leandroamaral"
        icon = "devicon-twitter-original"

  [languages.en]
    languageCode = 'en-us'
    languageName = 'EN'
    title = 'Amaral Stack'
    weight = 2

    [languages.en.menus]
      [[languages.en.menus.main]]
        name = 'Blog'
        pageRef = '/blog'
        weight = 10

    [languages.en.params]
      avatar = "/perfil.jpg"

      [[languages.en.params.socials]]
        link = "https://github.com/leandroamaral"
        icon = "devicon-github-original"
      [[languages.en.params.socials]]
        link = "https://linkedin.com/in/leandroamaral"
        icon = "devicon-linkedin-plain"
      [[languages.en.params.socials]]
        link = "https://x.com/leandroamaral"
        icon = "devicon-twitter-original"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$','$$'], ['\\[','\\]']]
        inline = [['$','$'], ['\\(','\\)']]

    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true

[markup.highlight]
  noClasses = true
  codeFences = true
  guessSyntax = true
  lineNos = true
  lineNumbersInTable = true
  tabWidth = 4
  style = "monokai"
